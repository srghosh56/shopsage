[project]
name = "shopsage"
version = "0.1.0"
description = "Recommendation and customer-analytics system on UCI Online Retail II, with an LLM explainer and a tool-using assistant."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==2.0.0",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "implicit==0.7.3",
    "langchain-core==1.7.3",
    "langchain-openai==1.7.3",
    "langgraph==1.2.19",
    "matplotlib==3.11.2",
    "mcp==2.3.0",
    "mlflow==3.17.2",
    "openai==3.42.0",
    "openpyxl==3.1.5",
    "pandas==3.1.0",
    "pyarrow==25.0.1",
    "pydantic-settings==2.16.2",
    "pymc-marketing==1.3.0",
    "python-dotenv==1.2.4",
    "rank-bm25==0.2.2",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "seaborn==0.13.2",
    "sentence-transformers==6.2.0",
    "sqlglot==30.27.0",
    "streamlit==1.66.1",
    "torch==2.15.0",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopsage"]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "mypy==2.4.1",
    "nbclient==0.11.0",
    "nbconvert==7.17.2",
    "pandas-stubs==3.1.0.261029",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "types-requests==2.33.0.20261030",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".python", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # formatter handles code; long SQL strings are fine

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = [".python/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs the full dataset or an LLM"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*noload.*"]

# Linux (Docker/CI) gets CPU-only torch instead of the multi-GB CUDA build
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
